name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Offline unittest suite (Python wheels only)
        run: >-
          uv run --python 3.12
          --with requests --with httpx --with img2pdf --with pillow
          --with keyring --with numpy --with 'av>=16,<18'
          python -m unittest discover -s tests
